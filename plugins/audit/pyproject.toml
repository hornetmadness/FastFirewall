[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-audit"
version = "0.9.0"
description = "FastFirewall plugin — records every event to an audit trail"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
]

[project.entry-points."fastfirewall.plugins"]
audit = "fastfirewall_plugin_audit"

[tool.uv.sources]
fastfirewall-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
sources = {"." = "fastfirewall_plugin_audit"}
exclude = ["data", "test_*.py", "CLAUDE.md"]
