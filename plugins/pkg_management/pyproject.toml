[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-pkg-management"
version = "1.0.0"
description = "FastFirewall plugin — manages OS packages, repositories, and system services via pyinfra"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
    "fastfirewall-plugin-smtp",
    "fastfirewall-plugin-audit",
]

[project.entry-points."fastfirewall.plugins"]
pkg_management = "fastfirewall_plugin_pkg_management"

[tool.uv.sources]
fastfirewall-core = { workspace = true }
fastfirewall-plugin-smtp = { workspace = true }
fastfirewall-plugin-audit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["fastfirewall_plugin_pkg_management"]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.py" = "fastfirewall_plugin_pkg_management/plugin.py"
"plugin.yaml" = "fastfirewall_plugin_pkg_management/plugin.yaml"
"_pkg_manager.py" = "fastfirewall_plugin_pkg_management/_pkg_manager.py"

[tool.hatch.build.targets.sdist]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]
