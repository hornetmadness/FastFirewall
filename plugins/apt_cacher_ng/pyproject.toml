[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-apt-cacher-ng"
version = "1.0.0"
description = "FastFirewall plugin — installs and manages apt-cacher-ng, a caching proxy for Debian/Ubuntu package downloads"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
]

[project.entry-points."fastfirewall.plugins"]
apt_cacher_ng = "fastfirewall_plugin_apt_cacher_ng"

[tool.uv.sources]
fastfirewall-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
sources = {"." = "fastfirewall_plugin_apt_cacher_ng"}
exclude = ["data", "test_*.py", "CLAUDE.md"]
