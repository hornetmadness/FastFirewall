name: Networking Plugin
id: networking
version: "1.0.0"
description: >
  Manages network interfaces and routes declaratively via ifstate (ifstatecli).
  Desired state is stored locally and pushed to the running kernel with
  POST /apply.  Routes mount at /v1/networking/.
author: hornetmadness@gmail.com

enabled: true

plugin_requirements: ["host"]
os_requirements:
  - mtr

service_ports:
  networking:
    tcp: [-1]

# Events emitted:
#   networking.interface.configured – payload: {name, addresses?, link?}
#   networking.interface.removed    – payload: {name}
#   networking.route.added          – payload: {route_id, to}
#   networking.route.removed        – payload: {route_id, to}
#   networking.applied              – payload: {success, returncode}

config:
  state_file: networking_state.json
  ignore_state_on_boot: false
  debug: true
