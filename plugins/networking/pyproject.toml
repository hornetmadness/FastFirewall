[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-networking"
version = "1.0.0"
description = "FastFirewall plugin — manages network interfaces and routes declaratively via systemd-networkd"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
    "fastfirewall-plugin-host",
    "pyroute2>=0.7",
]

[project.entry-points."fastfirewall.plugins"]
networking = "fastfirewall_plugin_networking"

[tool.uv.sources]
fastfirewall-core = { workspace = true }
fastfirewall-plugin-host = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["fastfirewall_plugin_networking"]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.py" = "fastfirewall_plugin_networking/plugin.py"
"plugin.yaml" = "fastfirewall_plugin_networking/plugin.yaml"

[tool.hatch.build.targets.sdist]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]
