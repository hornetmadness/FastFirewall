name: SMTP Plugin
id: smtp_plugin
version: "1.0.0"
description: >
  Manages Postfix SMTP server configuration — relay settings, TLS, SASL — and
  provides email sending and test-mail endpoints. Routes mount at /v1/smtp/.
author: hornetmadness@gmail.com

enabled: true

plugin_requirements: []
py_requirements: []
os_requirements:
  - postfix

skip_host_os_port_check: true  # Postfix is already running; this plugin manages it rather than starting it

service_ports:
  smtp:
    tcp: [25, 587, 465]

# Events emitted:
#   smtp.config.updated   – payload: {keys: [list of changed setting names]}
#   smtp.email.sent       – payload: {to, subject, from_addr}
#   smtp.queue.flushed    – payload: {}
#   smtp.postfix.reloaded – payload: {}
#
# Events consumed:
#   smtp.test             – payload: {to, subject?, body?}
#     Sends a test email to the given address out-of-band.
#   smtp.send             – payload: {to, subject, body, from_addr?, html?}
#     Sends an email on behalf of any plugin.

config:
  state_file: smtp_state.json
  smtp_host: "127.0.0.1"
  smtp_port: 25
  default_from: "fastfirewall@localhost"
  ignore_state_on_boot: false
