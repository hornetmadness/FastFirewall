[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-smtp"
version = "1.0.0"
description = "FastFirewall plugin — manages Postfix SMTP server configuration and provides email sending endpoints"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
]

[project.entry-points."fastfirewall.plugins"]
smtp = "fastfirewall_plugin_smtp"

[tool.uv.sources]
fastfirewall-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
sources = {"." = "fastfirewall_plugin_smtp"}
exclude = ["data", "test_*.py", "CLAUDE.md"]
