[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-caddy"
version = "1.0.0"
description = "FastFirewall plugin — manages Caddy as an HTTPS reverse proxy; other plugins register upstreams via the app_proxy.register event"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
]

[project.entry-points."fastfirewall.plugins"]
caddy = "fastfirewall_plugin_caddy"

[tool.uv.sources]
fastfirewall-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["fastfirewall_plugin_caddy"]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.py" = "fastfirewall_plugin_caddy/plugin.py"
"plugin.yaml" = "fastfirewall_plugin_caddy/plugin.yaml"

[tool.hatch.build.targets.sdist]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]
