name: Firewall Plugin
id: firewall
version: "1.0.0"
description: Manages firewall rules as a persistent JSON store and compiles them to nftables via a sudo wrapper script (nft_apply).
author: hornetmadness@gmail.com
enabled: true
plugin_requirements: ["host", "networking"]
os_requirements:
  - nftables

service_ports:
  firewall:
    tcp: [-1]

config:
  state_file: firewall_state.json
  default_filter_name: fastfirewall
  ignore_state_on_boot: false
