[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-firewall"
version = "1.0.0"
description = "FastFirewall plugin — manages firewall rules as a persistent JSON store and compiles them to nftables"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
    "fastfirewall-plugin-host",
    "fastfirewall-plugin-networking",
]

[project.entry-points."fastfirewall.plugins"]
firewall = "fastfirewall_plugin_firewall"

[tool.uv.sources]
fastfirewall-core = { workspace = true }
fastfirewall-plugin-host = { workspace = true }
fastfirewall-plugin-networking = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["fastfirewall_plugin_firewall"]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.py" = "fastfirewall_plugin_firewall/plugin.py"
"plugin.yaml" = "fastfirewall_plugin_firewall/plugin.yaml"
"models.py" = "fastfirewall_plugin_firewall/models.py"
"_nft" = "fastfirewall_plugin_firewall/_nft"
"nft_cmd" = "fastfirewall_plugin_firewall/nft_cmd"

[tool.hatch.build.targets.sdist]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]
