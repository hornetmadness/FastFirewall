[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-firewall"
version = "1.0.0"
description = "FastFirewall plugin — manages firewall rules as a persistent JSON store and compiles them to nftables"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
    "fastfirewall-plugin-host",
    "fastfirewall-plugin-networking",
]

[project.entry-points."fastfirewall.plugins"]
firewall = "fastfirewall_plugin_firewall"

[tool.uv.sources]
fastfirewall-core = { workspace = true }
fastfirewall-plugin-host = { workspace = true }
fastfirewall-plugin-networking = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
sources = {"." = "fastfirewall_plugin_firewall"}
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]

[tool.hatch.build.targets.sdist]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]
