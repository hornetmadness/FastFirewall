author: hornetmadness@gmail.com
description: 'Installs and configures fluent-bit and rsyslog to collect system logs
  (including systemd journal) and write them to /var/log/. Provides an API to read
  and tail log files.

  '
enabled: true
id: syslog
name: Syslog Plugin
version: 1.0.0
os_requirements:
- fluent-bit
- logrotate
plugin_requirements: []
py_requirements: []
skip_host_os_port_check: true  # rsyslog/fluent-bit are already running; this plugin manages them

service_ports:
  syslog:
    tcp: [514]
    udp: [514]

config:
  enable_systemd_input: true
  fastfirewall_conf: /etc/fluent-bit/conf.d/fastfirewall
  fluent_bit_main_conf: /etc/fluent-bit/fluent-bit.conf
  log_dir: /var/log/fastfirewall
  logrotate:
    compress: true
    conf: /etc/logrotate.d/fastfirewall
    frequency: daily
    max_size: ''
    rotate: 7
  max_tail_lines: 1000
  syslog_mode: udp
  syslog_port: 514
  syslog_unix_mode: unix_udp
  syslog_unix_path: ''
  ignore_state_on_boot: false
