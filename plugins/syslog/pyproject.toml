[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-syslog"
version = "1.0.0"
description = "FastFirewall plugin — installs and configures fluent-bit and rsyslog to collect system logs and provide a log reading API"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
    "fastfirewall-plugin-pkg-management",
]

[project.entry-points."fastfirewall.plugins"]
syslog = "fastfirewall_plugin_syslog"

[tool.uv.sources]
fastfirewall-core = { workspace = true }
fastfirewall-plugin-pkg-management = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["fastfirewall_plugin_syslog"]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.py" = "fastfirewall_plugin_syslog/plugin.py"
"plugin.yaml" = "fastfirewall_plugin_syslog/plugin.yaml"

[tool.hatch.build.targets.sdist]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]
