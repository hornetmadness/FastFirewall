[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-plugin-host"
version = "1.0.0"
description = "FastFirewall plugin — manages hostname, sysctl parameters, users, groups, and cron entries via pyinfra"
requires-python = ">=3.12"
authors = [{email = "hornetmadness@gmail.com"}]
dependencies = [
    "fastfirewall-core",
]

[project.entry-points."fastfirewall.plugins"]
host = "fastfirewall_plugin_host"

[tool.uv.sources]
fastfirewall-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["fastfirewall_plugin_host"]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.py" = "fastfirewall_plugin_host/plugin.py"
"plugin.yaml" = "fastfirewall_plugin_host/plugin.yaml"

[tool.hatch.build.targets.sdist]
exclude = ["data", "test_*.py", "CLAUDE.md", "*_state.json"]
