name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest --tb=short --junit-xml=test-results.xml

      - name: Test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: pytest results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false
