name: Check PR Mergeability

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-mergeable:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check merge conflict status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fetch the mergeable status using GitHub CLI
          STATUS=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')
          
          echo "Mergeable status is: $STATUS"
          
          if [ "$STATUS" = "CONFLICTING" ]; then
            echo "❌ Error: This PR has merge conflicts and cannot be cleanly merged!"
            exit 1
          elif [ "$STATUS" = "UNKNOWN" ]; then
            echo "⚠️ Warning: GitHub is still calculating the merge state. Please re-run this check."
            exit 1
          else
            echo "✅ Success: The PR can be cleanly merged."
          fi
