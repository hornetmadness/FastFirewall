[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastfirewall-core"
version = "0.1.0"
description = "Plugin-driven network appliance API built on FastAPI — plugins own routes, services, and events; the core provides lifecycle management, an event bus, and a service exclusivity registry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pyinfra>=3.8.0",
    "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.4",
    "bcrypt>=4.0",
    "idna>=3.15",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
asyncio_mode = "auto"
pythonpath = ["."]

[project.scripts]
fastfirewall-api = "fastfirewall_app:main"

[tool.hatch.build.targets.wheel]
packages = ["plugin_system", "ff_auth", "infra"]

[tool.hatch.build.targets.wheel.force-include]
"fastfirewall_app.py" = "fastfirewall_app.py"
"app_config.py" = "app_config.py"
"request_context.py" = "request_context.py"
"app_config.yaml" = "app_config.yaml"

[tool.uv]
package = true
# CVE fix: paramiko 5.x drops the ecdsa dependency entirely, eliminating both
# the Minerva timing-attack CVE (ecdsa, alert #1) and the SHA-1 CVE (paramiko, alert #2).
# pyinfra 3.x caps paramiko at <5 but this project only uses the @local connector
# (no SSH), so the override is safe.
override-dependencies = [
    "paramiko>=5.0.0",
]

[tool.uv.workspace]
members = ["plugins/*", "meta"]
