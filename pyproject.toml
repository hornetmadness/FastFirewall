[project]
name = "FastFirewall"
version = "0.1.0"
description = "Plugin-driven network appliance API built on FastAPI — plugins own routes, services, and events; the core provides lifecycle management, an event bus, and a service exclusivity registry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pyinfra>=3.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false
