# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: DEBUG
  format: "%(levelname)s [%(request_id)s] %(name)s: %(message)s"

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  src_code_dir: plugins     # relative to the repo root; resolved at startup

  # Extra directories scanned for plugins after the main directory.
  # Checked in order; a plugin found here is skipped if already loaded from
  # a higher-priority directory.  ~ is expanded.
  scan_dirs:
    - /etc/fastfirewall/plugins
    - ~/.config/fastfirewall/plugins

  # When set, plugin state files are stored at <data_dir>/<plugin_id>/
  # instead of inside the plugin package directory.  Recommended for
  # production installs so state persists across package upgrades.
  # Null = keep state inside each plugin's own directory (dev default).
  data_dir:   # e.g. ~/.config/fastfirewall/plugins

  # When set, plugin config files are stored at <cfg_dir>/<plugin_id>/
  # instead of inside the plugin package directory.  Useful for keeping
  # operator-managed config (e.g. copied from plugin defaults) out of
  # installed package directories so it survives upgrades.
  # Null = keep config inside each plugin's own directory (dev default).
  cfg_dir:    # e.g. /etc/fastfirewall/plugins

# ── Server (uvicorn / FastAPI) ────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  reload-excludes: ["*/plugins/*/data/*"]   # watch for code changes but ignore the data directory
  max_payload_bytes: 5242880  # 5 MB — requests larger than this return 413
  cors:
    allowed_origins: []  # e.g. ["https://myfirewall.local"] — empty = no CORS headers sent

bootstrap:
  enabled: fasle

# ── State ─────────────────────────────────────────────────────────────────────
state:
  backup:
    enabled: true          # set to true to snapshot state files before each save
    directory: /var/tmp/ff-backups/states

# ── Authentication ─────────────────────────────────────────────────────────────
auth:
  enabled: true
  # Generate a strong key: openssl rand -hex 32
  secret_key: "CHANGE-ME"
  algorithm: HS256
  token_expire_minutes: 60
  # Paths that do not require a valid credential
  exempt_paths:
    - /token
    - /docs
    - /openapi.json
    - /redoc
  rate_limit:
    max_attempts: 5       # failed /token attempts before 429
    window_seconds: 300   # sliding window length in seconds
  trusted_proxies: []     # e.g. ["127.0.0.1"] — IPs whose X-Forwarded-For header is trusted
  users:
    - username: admin
      # Plaintext is hashed at startup; use a bcrypt hash in production:
      #   python -c "from passlib.context import CryptContext; print(CryptContext(schemes=['bcrypt']).hash('yourpassword'))"
      password: "admin"
      roles: [admin]
